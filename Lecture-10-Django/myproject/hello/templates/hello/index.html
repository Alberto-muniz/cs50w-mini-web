<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flex Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        .header {
            background-color: #005BAC; /* Azul tipo corporativo */
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
        }

        h2 {
            color: #005BAC;
        }

        p {
            font-size: 16px;
        }

        .status-ok {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Flex System Dashboard</h1>
    </div>

    <div class="container">
        <div class="card">
            
            <h2>System Status</h2>
            <p class="status-ok">All systems operational ✅</p>

            <h2>User Session</h2>
            <p>Connected user: Alberto</p>

            <h2>Environment</h2>
            <p>Django Backend Running </p>

            <h2>Last Check</h2>
